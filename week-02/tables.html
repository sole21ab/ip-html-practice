<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Tables</title>
</head>
<body>
    <h1>HTML Tables</h1>

    <table border="1" cellpadding="10" cellspacing="5">
        <tr>
            <th>Name</th>
            <th>Department</th>
            <th>Year</th>
        </tr>
        <tr>
            <td>Soleyana</td>
            <td>Software Engineering</td>
            <td>3</td>
        </tr>
        <tr>
            <td>Student 2</td>
            <td>Computer Science</td>
            <td>2</td>
        </tr>
    </table>

    <h2>Using Colspan</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th colspan="2">Student Information</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>Soleyana</td>
        </tr>
    </table>

    <h2>Using Rowspan</h2>

    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th rowspan="2">Department</th>
            <td>Software Engineering</td>
        </tr>
        <tr>
            <td>Computer Science</td>
        </tr>
    </table>
</body>
</html>
