<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Forms and Multimedia</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="#" method="get">
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" required>
            <br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="100" placeholder="Age">
            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="color">Favorite Color:</label>
            <input type="color" id="color" name="color">
            <br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" name="file">
            <br><br>

            <input type="hidden" name="formType" value="student">
        </fieldset>

        <fieldset>
            <legend>Additional Information</legend>

            <p>Gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>

            <p>Interests:</p>
            <input type="checkbox" id="coding" name="interests" value="coding">
            <label for="coding">Coding</label>

            <input type="checkbox" id="design" name="interests" value="design">
            <label for="design">Design</label>
            <br><br>

            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Choose a department</option>
                <optgroup label="Engineering">
                    <option value="software">Software Engineering</option>
                    <option value="computer">Computer Engineering</option>
                </optgroup>
            </select>
            <br><br>

            <label for="message">About Yourself:</label>
            <textarea id="message" name="message" rows="4" cols="30"></textarea>
            <br><br>

            <label for="studentId">Student ID (letters followed by 3 digits):</label>
            <input
                type="text"
                id="studentId"
                name="studentId"
                pattern="[A-Za-z]+[0-9]{3}"
                title="Enter letters followed by exactly 3 digits"
            >
            <br><br>

            <label for="quantity">Quantity (step of 2):</label>
            <input type="number" id="quantity" name="quantity"
                   min="0" max="20" step="2">
        </fieldset>

        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" onclick="alert('Hello!')">Click Me</button>
    </form>

    <hr>

    <h2>Audio</h2>
    <audio controls autoplay loop>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <h2>Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support video.
    </video>
</body>
</html>
